<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Private Banking"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><title>Private Banking</title>
<style>
:root{--bg:#0d0c0c;--bg2:#1a1818;--ln:#2e2a29;--tx:#f3ece8;--mu:#9a908c;--rg:#e0a899;--ok:#8fc9a0;--bad:#d97b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#app{max-width:520px;margin:0 auto;padding:18px}
h1{font-size:26px;font-weight:600}h2{font-size:15px;color:var(--mu);font-weight:500;margin:22px 0 10px}
.sm{font-size:12px;color:var(--mu)}.rg{color:var(--rg)}
.card{aspect-ratio:1.586;border-radius:16px;border:1px solid var(--rg);background:linear-gradient(135deg,#3a3231 0%,#151313 45%,#2a2321 100%);padding:18px;position:relative;margin:16px 0}
.card b{position:absolute;right:18px;bottom:12px;font-size:34px;color:var(--rg);font-weight:400}
.card .n{position:absolute;left:18px;bottom:16px;letter-spacing:3px;font-family:Georgia,serif}
.card .t{position:absolute;left:18px;top:16px;font-size:11px;letter-spacing:3px;color:var(--rg)}
.box{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.bal{font-size:30px;font-weight:600}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.quick{display:flex;align-items:flex-start;gap:8px;overflow-x:auto;padding-bottom:4px}
.q{flex:0 0 78px;text-align:center;font-size:12px;background:none;border:0;color:var(--tx)}
.q i,.ic{display:flex;width:48px;height:48px;margin:0 auto 6px;border:1px solid var(--rg);border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-size:22px}
.ic{margin:0;flex:0 0 44px;width:44px;height:44px;font-size:20px}
.cp{display:flex;gap:12px;align-items:center}.cp.off{opacity:.4}.cp .m{flex:1}
button,.btn{font:inherit;cursor:pointer}
.b{background:var(--rg);color:#1a1210;border:0;border-radius:20px;padding:7px 16px;font-weight:600}
.b.g{background:none;border:1px solid var(--ln);color:var(--tx)}.b.x{background:none;color:var(--bad);border:1px solid var(--bad)}
.b:disabled{opacity:.35}
input,select,textarea{width:100%;background:#0d0c0c;border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:9px 10px;font:inherit;margin:4px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{font-size:11px;border-radius:8px;padding:1px 8px;border:1px solid}
.p{color:#e8c36a}.d{color:var(--ok)}.r{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:#121010ee;border-top:1px solid var(--ln);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(10px)}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:6px 0}nav button i{display:block;font-style:normal;font-size:20px}nav .on{color:var(--rg)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
#modal>div{background:var(--bg2);border:1px solid var(--rg);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center}
.card .em{position:absolute;left:18px;top:12px;font-size:34px;line-height:1.1;letter-spacing:4px;color:var(--rg);font-family:Georgia,serif}.card .ini{position:absolute;left:18px;top:42px;font-size:60px;line-height:1;color:#e0a89938;font-family:Georgia,serif}.ck{text-shadow:0 0 28px #8fc9a077;font-size:54px;color:var(--ok);animation:pop .5s}@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.dot{display:inline-block;width:8px;height:8px;background:var(--bad);border-radius:50%;margin-left:3px}
input[type=date]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:42px;text-align:left}.fl{display:block}.lb{display:block;font-size:12px;color:var(--mu);margin-top:6px}</style></head><body>
<div id="app"><p class="sm">載入中…</p></div><nav id="nav"></nav><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'NT$ '+Number(n).toLocaleString();
const local=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString();
const today=()=>local().slice(0,10), mkey=()=>local().slice(0,7);
const S={w:[],c:[],l:[],r:[],p:null,tab:'home',admin:false,prev:false,edit:null,db:null,ready:{},err:''};
const CATS=['日常小確幸','身體放鬆','家事代理','約會體驗','特別券'];
const SEED=[[0,'☕','手搖飲兌換券',150],[0,'🍜','宵夜外送券',300],[0,'🍰','甜品下午茶券',500],[1,'💨','吹頭髮服務券',200],[1,'💆','15 分鐘按摩券',300],[1,'🦶','腳底按摩 30 分鐘',600],[2,'🍽','洗碗一次',200],[2,'🗑','倒垃圾一週',300],[2,'🧹','一週家事代理',1500],[3,'🍴','她決定今晚吃什麼（不准說隨便）',400],[3,'🎬','電影夜（她選片）',800],[3,'🚗','一日出遊（她決定去哪）',2500],[4,'🛡','免死金牌（吵架時可用）',1000],[4,'👑','任性一次（無條件答應一個小要求）',1200],[4,'🎁','隱藏券：神秘禮物',2000]];
const live=r=>r.status!=='rejected';
const loan=()=>S.p?.loan||0;
const bal=()=>S.l.reduce((a,x)=>a+x.amt,0)-S.r.filter(live).reduce((a,x)=>a+x.price,0);
function info(c){
  const u=S.r.filter(x=>x.cid===c.id&&live(x)),um=u.filter(x=>x.mk===mkey()).length;
  let left=Infinity,txt='';
  if(c.lt==='total'){left=c.ln-u.length;txt=`剩 ${Math.max(left,0)} 張`}
  if(c.lt==='month'){left=c.ln-um;txt=`本月剩 ${Math.max(left,0)} 次`}
  const exp=c.exp&&today()>c.exp, lock=c.hid&&bal()<c.price;
  let st='ok';if(exp)st='已過期';else if(left<=0)st='已用完';else if(bal()+loan()<c.price)st='餘額不足';
  const dl=c.exp?Math.ceil((new Date(c.exp)-new Date(today()))/864e5):null;
  return {txt,st,lock,dl};
}
let AC;document.addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}});
function fx(){try{navigator.vibrate&&navigator.vibrate([40,30,60])}catch(e){}try{if(!AC)return;const t=AC.currentTime;[880,1320].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),s=t+i*.11;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.25);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.3)})}catch(e){}}
function rollBal(){const el=document.querySelector('.bal[data-b]');if(!el)return;const to=+el.dataset.b,from=S.pb??to;S.pb=to;if(from===to)return;const t0=performance.now();(function f(t){const k=Math.min((t-t0)/700,1),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(f)})(t0)}
function modal(h){const m=$('#modal');m.innerHTML=`<div>${h}</div>`;m.style.display='flex';if(h.includes('class="ck"'))fx()}
function close(){$('#modal').style.display='none'}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){
  firebase.initializeApp({apiKey:"AIzaSyA7OG3wqecJXDpHarEWtLjI6y50SshWGlk",authDomain:"private-bank-179b3.firebaseapp.com",projectId:"private-bank-179b3",storageBucket:"private-bank-179b3.firebasestorage.app",messagingSenderId:"399436644318",appId:"1:399436644318:web:ac803f2e9e11b3035fa74f"});
  S.db=firebase.firestore();S.want=['#admin','#collect'].includes(location.hash);
  const e=er=>{S.err='資料庫錯誤：'+(er.code||er.message);render()};
  const sub=(q,k,f)=>q.onSnapshot(s=>{f(s);S.ready[k]=1;gate();render()},e);
  sub(S.db.collection('coupons'),'c',s=>S.c=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||a.o-b.o));
  sub(S.db.collection('ledger'),'l',s=>S.l=s.docs.map(d=>({id:d.id,...d.data()})));
  S.db.collection('redeem').onSnapshot(s=>{
    if(S.ready.r&&!S.admin)s.docChanges().forEach(c=>{const x=c.doc.data();if(c.type==='added'&&x.kind==='pay'&&!c.doc.metadata.hasPendingWrites&&new Date(local())-new Date(x.ts)<2e4)popSuccess(x)});
    S.r=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.r=1;gate();render()},e);
  sub(S.db.collection('wish'),'w',s=>S.w=s.docs.map(d=>({id:d.id,...d.data()})));
  const m=location.hash.match(/^#pay=(\w+)/);
  if(m)S.db.doc('pay/'+m[1]).get().then(s=>{if(!s.exists)return;const d=s.data();
    if(d.status!=='open')return modal('<h1 style="font-size:18px">此收款碼已使用</h1><button class="b" style="margin-top:12px" data-a="close">關閉</button>');
    S.payInfo={id:s.id,...d};modal(`<div class="sm">收款確認</div><div class="bal" style="margin:8px 0">${fmt(d.amt)}</div><p class="sm">${esc(d.note||'')}</p><div class="row" style="margin-top:12px"><button class="b g" style="flex:1" data-a="close">取消</button><button class="b" style="flex:1" data-a="payok">確認付款</button></div>`)});
  S.db.doc('bank/profile').onSnapshot(s=>{S.p=s.exists?s.data():null;S.ready.p=1;gate();render()},e);
  S.db.doc('bank/auth').onSnapshot(s=>{S.auth=s.exists?s.data():null;S.ready.a=1;
    try{if(S.want&&!S.admin&&S.auth&&localStorage.getItem('adm')===S.auth.h){S.admin=true;S.tab=location.hash==='#collect'?'pay':'pend'}}catch(x){}render()},e);
}
let gated=0;
function gate(){ // monthly credit once per load, idempotent doc id
  if(gated||!(S.ready.l&&S.ready.p)||!S.p)return;gated=1;
  const id='m-'+mkey();
  if(!S.l.find(x=>x.id===id)&&S.p.monthly>0)S.db.doc('ledger/'+id).set({amt:S.p.monthly,note:'月初固定入帳',ts:local()}).catch(()=>{});
  (S.p.bonuses||[]).forEach(b=>{const bid='b-'+local().slice(0,4)+'-'+b.md;if(b.md===local().slice(5,10)&&!S.l.find(x=>x.id===bid))S.db.doc('ledger/'+bid).set({amt:b.amt,note:b.note,ts:local()}).catch(()=>{})});
}
async function seed(){
  await S.db.doc('bank/profile').set({name:'寶貝',monthly:5000,brand:'♥'});
  for(let i=0;i<SEED.length;i++){const[c,ic,n,p]=SEED[i];
    await S.db.collection('coupons').doc('c'+String(i).padStart(2,'0')).set({n,price:p,cat:CATS[c],ic,lt:'none',ln:0,exp:'',on:true,hid:i===14,o:i})}
}
const head=(t)=>`<p class="sm" style="letter-spacing:2px">${t}</p>`;
const cardH=()=>{const em=S.p.em;return `<div class="card">${em?`<span class="em">${esc(em)}</span><span class="t" style="top:58px">PRIVATE BANKING</span>`:`<span class="t">PRIVATE BANKING</span><span class="ini">${esc((S.p.name||"").slice(0,1).toUpperCase())}</span>`}<span class="sm" style="position:absolute;right:18px;top:16px">))) </span><span class="n">${esc(S.p.name)}</span><b>${esc(S.p.brand||'♥')}</b></div>`};
function cpRow(c,btn=true){
  const i=info(c),ok=i.st==='ok';
  if(i.lock)return `<div class="box cp off"><div class="ic">❓</div><div class="m"><b>???</b><div class="sm">餘額達 ${fmt(c.price)} 解鎖</div></div></div>`;
  return `<div class="box cp ${ok?'':'off'}"><div class="ic">${c.ic||'🎫'}</div><div class="m"><b>${c.pin?'⭐ ':''}${esc(c.n)}</b><div class="sm">${fmt(c.price)}${i.txt?' · '+i.txt:''}${c.exp?' · 至 '+c.exp+(i.dl!=null&&i.dl>=0&&i.dl<=7?' <span class="r">（剩 '+i.dl+' 天）</span>':''):''}</div></div>${btn?(ok?`<button class="b" data-a="ask" data-id="${c.id}">兌換</button>`:`<span class="sm">${i.st}</span>`):''}</div>`;
}
function view(){
  if(S.err)return `<p class="r">${esc(S.err)}</p>`;
  if(!S.ready.p||!S.ready.c||!S.ready.a)return '<p class="sm">載入中…</p>';
  if(S.want&&!S.admin)return S.auth?`<h1>客戶經理登入</h1><div class="box" style="margin-top:16px"><input id="pw" type="password" placeholder="管理密碼"><button class="b" data-a="login">登入</button></div>`:`<h1>設定管理密碼</h1><p class="sm">第一次使用，請設定只有你知道的密碼（至少 4 碼）。</p><div class="box" style="margin-top:16px"><input id="pw" type="password" placeholder="新密碼"><button class="b" data-a="setpw">設定</button></div>`;
  if(!S.p)return S.admin?`<h1>歡迎，客戶經理</h1><p class="sm" style="margin:10px 0 18px">資料庫是空的。按下按鈕建立 15 張預設券與每月 NT$ 5,000 額度，之後都能修改。</p><button class="b" data-a="seed">初始化銀行</button>`:`<h1>銀行開業準備中…</h1><p class="sm">請稍後再來 ♥</p>`;
  const A=S.admin&&!S.prev,t=S.tab,act=S.c.filter(c=>c.on);
  if(A){
    if(t==='pend'){const L=S.r.filter(x=>x.status==='pending').sort((a,b)=>a.ts<b.ts?-1:1);
      return wishA()+h('待處理申請')+(L.length?L.map(x=>`<div class="box"><b>${esc(x.n)}</b> <span class="sm">${fmt(x.price)} · ${x.ts.slice(5,16).replace('T',' ')}</span>${x.date?`<div class="sm">預約：${esc(x.date)}</div>`:''}<input id="re${x.id}" placeholder="留一句話給她（選填）"><div class="row"><button class="b" data-a="done" data-id="${x.id}">完成</button><button class="b g" data-a="rej" data-id="${x.id}">退回並退款</button></div></div>`).join(''):'<p class="sm">目前沒有待處理 ✓</p>')+log([],S.r.filter(x=>x.status!=='pending'))}
    if(t==='cpn'){const e=S.edit||{};
      return h('券管理')+`<div class="box"><div class="g2"><input id="en" placeholder="券名稱" value="${esc(e.n||'')}"><input id="ei" placeholder="圖示 emoji" value="${esc(e.ic||'')}"></div><div class="g2"><input id="ep" type="number" placeholder="價格" value="${e.price??''}"><select id="ec">${CATS.map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="g2"><select id="et"><option value="none">無限次數</option><option value="month" ${e.lt==='month'?'selected':''}>每月重置</option><option value="total" ${e.lt==='total'?'selected':''}>總量制（可補發）</option></select><input id="el" type="number" placeholder="次數／張數" value="${e.ln||''}"></div><div class="sm">有效期限（空白＝無限期）</div><input id="ex" type="date" value="${e.exp||''}"><div class="row"><button class="b" data-a="save">${e.id?'儲存修改':'新增券'}</button>${e.id?'<button class="b g" data-a="cancel">取消</button>':''}</div></div>`+S.c.map(c=>`<div class="box cp ${c.on?'':'off'}"><div class="ic">${c.ic||'🎫'}</div><div class="m"><b>${c.pin?'⭐ ':''}${esc(c.n)}</b><div class="sm">${fmt(c.price)} · ${c.lt==='month'?'每月 '+c.ln+' 次':c.lt==='total'?'共 '+c.ln+' 張':'無限'}${c.exp?' · 至 '+c.exp:''}</div></div><button class="b g" data-a="pin" data-id="${c.id}">${c.pin?'★':'☆'}</button><button class="b g" data-a="edit" data-id="${c.id}">編輯</button><button class="b g" data-a="tog" data-id="${c.id}">${c.on?'下架':'上架'}</button></div>`).join('')}
    if(t==='pay'){const P=S.pay;return h('向她收款')+`<div class="box"><input id="pa" type="number" placeholder="金額"><input id="pn2" placeholder="備註，例如：宵夜"><div class="row"><button class="b" data-a="mkpay">產生收款碼</button><button class="b g" data-a="charge">直接扣款</button></div></div>`+(P?`<div class="box" style="text-align:center"><b>${fmt(P.amt)}</b> <span class="sm">${esc(P.note||'')}</span><br><div id="qr1" style="display:inline-block;background:#fff;padding:8px;border-radius:8px;margin:10px 0"></div><div class="${P.status==='paid'?'d':'sm'}">${P.status==='paid'?'✓ 她已付款':'等待她掃碼付款…'}</div></div>`:'')+`<p class="sm">她的付款碼在她的「卡片」頁。用相機掃描後登入，會來到這一頁，輸入金額按「直接扣款」即可。</p>`}
    if(t==='cr')return h('入帳／扣款')+`<div class="box"><div class="sm">目前餘額</div><div class="bal" data-b="${bal()}">${fmt(bal())}</div><input id="ca" type="number" placeholder="金額（扣款請輸入負數）"><input id="cn" placeholder="備註，例如：因為你今天很可愛"><button class="b" data-a="credit">入帳</button></div>`+h('設定')+`<div class="box"><div class="g2"><label class="fl"><span class="lb">她的名字</span><input id="pn" placeholder="她的名字" value="${esc(S.p.name)}"></label><label class="fl"><span class="lb">每月固定入帳（NT$）</span><input id="pm" type="number" placeholder="每月入帳" value="${S.p.monthly}"></label></div><label class="fl"><span class="lb">卡面右下角符號</span><input id="pb" placeholder="卡面符號，例如 ♥ 或 30" value="${esc(S.p.brand||'♥')}"></label><label class="fl"><span class="lb">卡面左上角（紀念日）</span><input id="pe" placeholder="卡面左上角，例如紀念日 1127" value="${esc(S.p.em||'')}"></label><label class="fl"><span class="lb">首頁每日留言</span><input id="pg" placeholder="首頁每日留言（選填）" value="${esc(S.p.msg||'')}"></label><div class="g2"><label class="fl"><span class="lb">預借額度（0＝關閉）</span><input id="pl" type="number" placeholder="預借額度（0＝關閉）" value="${S.p.loan||''}"></label><label class="fl"><span class="lb">每日簽到金額（0＝關閉）</span><input id="pd" type="number" placeholder="每日簽到金額（預設 20）" value="${S.p.daily??''}"></label></div><div class="sm">自動紅利，每行：月-日 金額 備註（例：11-27 1127 紀念日快樂）</div><textarea id="pbn" rows="3">${esc((S.p.bonuses||[]).map(b=>b.md+' '+b.amt+' '+b.note).join('\n'))}</textarea><button class="b" data-a="prof">儲存設定</button><h2 style="margin-top:22px">危險區</h2><button class="b x" data-a="wipe">清除所有測試資料</button></div>`+log(S.l,[])
  }
  if(t==='home'){const q=act.filter(c=>!c.hid).slice(0,6);
    return head('GOOD '+(new Date().getHours()<12?'MORNING':new Date().getHours()<18?'AFTERNOON':'EVENING'))+`<h1>Hi, ${esc(S.p.name)}</h1><p class="sm">感謝妳選擇專屬於妳的專屬黑卡</p>`+cardH()+(S.p.msg?`<div class="box"><div class="sm">客戶經理留言</div>${esc(S.p.msg)}</div>`:'')+`<div class="box"><div class="sm">可用餘額</div><div class="bal" data-b="${bal()}">${fmt(bal())}</div>${loan()?`<div class="sm">預借額度 ${fmt(loan())}${bal()<0?' · 已預借 '+fmt(-bal()):''}</div>`:''}</div>`+checkin()+expb()+h('經常兌換')+`<div class="quick">${q.map(c=>`<button class="q" data-a="ask" data-id="${c.id}"><i>${c.ic||'🎫'}</i>${esc(c.n.split(/[（(：]/)[0])}</button>`).join('')}</div>`}
  if(t==='ex')return h('兌換')+`<div class="sm" style="margin-bottom:6px">餘額 ${fmt(bal())}</div>`+CATS.map(k=>{const L=act.filter(c=>c.cat===k);return L.length?`<h2>${k}</h2>`+L.map(c=>cpRow(c)).join(''):''}).join('')+wishH()
  if(t==='log')return h('記錄')+log(S.l,S.r)
  if(t==='card'){const m=S.r.filter(x=>live(x)&&x.mk===mkey()),sp=m.reduce((a,x)=>a+x.price,0),cnt={};m.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    return h('卡片')+cardH()+`<div class="box" style="text-align:center"><div class="rg">))) 將卡片靠近手機感應</div><div class="sm">專屬客戶經理隨時為妳服務</div></div><div class="box" style="text-align:center"><div class="sm" style="margin-bottom:8px">付款碼・出示給客戶經理掃描</div><div id="qr2" style="display:inline-block;background:#fff;padding:8px;border-radius:8px"></div></div>`+h('本月月結')+`<div class="box"><div class="row sp"><span>本月入帳</span><span>${fmt(S.l.filter(x=>x.ts.slice(0,7)===mkey()).reduce((a,x)=>a+x.amt,0))}</span></div><div class="row sp"><span>本月花費</span><span>${fmt(sp)}</span></div><div class="row sp"><span>最常兌換</span><span>${top?esc(top[0].split(/[（(：]/)[0])+' ×'+top[1]:'—'}</span></div></div>`}
  return '';
}
function streak(){const ids=new Set(S.l.filter(x=>x.id.startsWith('d-')).map(x=>x.id.slice(2)));let n=0,d=new Date(today());if(!ids.has(today()))d.setUTCDate(d.getUTCDate()-1);while(ids.has(d.toISOString().slice(0,10))){n++;d.setUTCDate(d.getUTCDate()-1)}return n}
function checkin(){const dl=S.p.daily??20;if(!dl)return'';const done=S.l.find(x=>x.id==='d-'+today()),st=streak(),big=(st+1)%7===0;return `<div class="box row sp"><div><b>每日簽到</b><div class="sm">${done?'今日已簽到 ✓ · 連續 '+st+' 天':'今日領 '+fmt(dl*(big?6:1))+(big?'（連續第 7 天 6 倍！）':'')+' · 連續 '+st+' 天'}</div></div>${done?'':'<button class="b" data-a="sign">簽到</button>'}</div>`}
function expb(){const L=S.c.filter(c=>c.on&&c.exp&&info(c).st==='ok').map(c=>({c,dl:info(c).dl})).filter(x=>x.dl>=0&&x.dl<=7).sort((a,b)=>a.dl-b.dl)[0];return L?`<div class="box"><span class="r">⏰ ${esc(L.c.n.split(/[（(：]/)[0])} 將於 ${L.dl} 天後到期</span></div>`:''}
const wishH=()=>h('許願池')+`<div class="box"><input id="wt" placeholder="我想要一張…券"><button class="b" data-a="wish">許願</button></div>`+[...S.w].sort((a,b)=>a.ts<b.ts?1:-1).slice(0,8).map(x=>`<div class="box row sp"><span>🌠 ${esc(x.text)}</span><span class="tag ${x.st==='open'?'p':x.st==='ok'?'d':'r'}">${x.st==='open'?'審核中':x.st==='ok'?'已上架':'再想想'}</span></div>`).join('');
const wishA=()=>{const W=S.w.filter(x=>x.st==='open');return W.length?h('她的願望')+W.map(x=>`<div class="box"><b>🌠 ${esc(x.text)}</b><input id="wp${x.id}" type="number" placeholder="定價（NT$）"><div class="row"><button class="b" data-a="wok" data-id="${x.id}">上架成券</button><button class="b g" data-a="wno" data-id="${x.id}">再想想</button></div></div>`).join(''):''};
function popSuccess(x){modal(`<div class="ck">✓</div><h1 style="font-size:18px">付款成功</h1><div class="bal" style="margin:6px 0">-${Number(x.price).toLocaleString()}</div><p class="sm">${esc(x.n||'')}</p>`);setTimeout(close,2200)}
function drawQR(){if(typeof QRCode==='undefined')return;const b=location.href.split('#')[0],q=(id,t)=>{const el=$('#'+id);if(el&&!el.firstChild)new QRCode(el,{text:t,width:170,height:170})};q('qr2',b+'#collect');if(S.pay)q('qr1',b+'#pay='+S.pay.id)}
const h=t=>`<h2>${t}</h2>`;
function log(Ls,Rs){
  const rows=[...Ls.map(x=>({ts:x.ts,l:x})),...Rs.map(x=>({ts:x.ts,r:x}))].sort((a,b)=>a.ts<b.ts?1:-1).slice(0,40);
  return rows.map(z=>{const d=z.ts.slice(5,16).replace('T',' ');
    if(z.l)return `<div class="box row sp"><div><b>入帳</b><div class="sm">${esc(z.l.note||'')} · ${d}</div></div><b class="d">${z.l.amt>0?'+':''}${Number(z.l.amt).toLocaleString()}</b></div>`;
    const x=z.r,c={pending:['處理中','p'],done:['已完成','d'],rejected:['已退回','r']}[x.status];
    return `<div class="box" data-a="rcpt" data-id="${x.id}"><div class="row sp"><div><b>${esc(x.n)}</b><div class="sm">${d}${x.date?' · 預約 '+esc(x.date):''}</div></div><div style="text-align:right"><b>-${Number(x.price).toLocaleString()}</b><br><span class="tag ${c[1]}">${c[0]}</span></div></div>${x.reply?`<div class="sm rg" style="margin-top:6px">客戶經理：${esc(x.reply)}</div>`:''}</div>`}).join('')||'<p class="sm">還沒有紀錄</p>';
}
function render(){
  $('#app').innerHTML=view()+'<p class="sm" style="text-align:center;margin:28px 0 0;opacity:.45">v4</p>';setTimeout(drawQR,0);setTimeout(rollBal,0);
  const A=S.admin&&!S.prev,np=S.r.filter(x=>x.status==='pending').length+S.w.filter(x=>x.st==='open').length;
  const T=A?[['pend','📥','待處理'],['cpn','🎫','券管理'],['pay','📲','收款'],['cr','💰','入帳'],['prev','👁','她的畫面']]:[['home','🏠','首頁'],['ex','🎁','兌換'],['log','🧾','記錄'],['card','💳','卡片']].concat(S.admin?[['back','⚙️','後台']]:[]);
  $('#nav').innerHTML=(S.p&&!S.err)?T.map(([k,i,n])=>`<button data-a="tab" data-id="${k}" class="${S.tab===k?'on':''}"><i>${i}</i>${n}${k==='pend'&&np?'<span class="dot"></span>':''}</button>`).join(''):'';
}
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,v=i=>$('#'+i)?.value??'';
  const db=S.db;try{
  if(a==='login'){const h=await sha(v('pw'));if(h===S.auth.h){try{localStorage.setItem('adm',h)}catch(x){}S.admin=true;S.tab=location.hash==='#collect'?'pay':'pend';render()}else alert('密碼錯誤')}
  else if(a==='setpw'){if(v('pw').length<4)return alert('至少 4 碼');const h=await sha(v('pw'));await db.doc('bank/auth').set({h});try{localStorage.setItem('adm',h)}catch(x){}S.admin=true;S.tab=location.hash==='#collect'?'pay':'pend';render()}
  else if(a==='tab'){if(id==='prev'){S.prev=true;S.tab='home'}else if(id==='back'){S.prev=false;S.tab='pend'}else S.tab=id;render();window.scrollTo(0,0)}
  else if(a==='sign'){const n=streak()+1,dl=S.p.daily??20,amt=dl*(n%7===0?6:1);await db.doc('ledger/d-'+today()).set({amt,note:'每日簽到（連續 '+n+' 天）',ts:local()});modal(`<div class="ck">✓</div><h1 style="font-size:18px">簽到成功</h1><div class="bal d" style="margin:6px 0">+${amt}</div><p class="sm">連續 ${n} 天</p>`);setTimeout(close,1800)}
  else if(a==='wish'){const t=v('wt').trim();if(!t)return;await db.collection('wish').add({text:t,ts:local(),st:'open'})}
  else if(a==='wok'){const p=Number(v('wp'+id));if(!(p>0))return alert('請輸入定價');const w=S.w.find(z=>z.id===id);await db.doc('coupons/c'+Date.now()).set({n:w.text,price:p,cat:'特別券',ic:'🌠',lt:'none',ln:0,exp:'',on:true,hid:false,o:Date.now()});await db.doc('wish/'+id).update({st:'ok'})}
  else if(a==='wno'){await db.doc('wish/'+id).update({st:'no'})}
  else if(a==='rcpt'){const x=S.r.find(z=>z.id===id);if(!x)return;const L=(k,t)=>`<div class="row sp sm" style="margin:6px 0"><span>${k}</span><span style="color:var(--tx)">${t}</span></div>`;modal(`<div class="sm" style="letter-spacing:3px">RECEIPT</div><div class="bal" style="margin:6px 0 12px">-${Number(x.price).toLocaleString()}</div>`+L('項目',esc(x.n))+L('單號',id.slice(-8).toUpperCase())+L('時間',x.ts.slice(0,16).replace('T',' '))+L('狀態',{pending:'處理中',done:'已完成',rejected:'已退回'}[x.status])+(x.date?L('預約',esc(x.date)):'')+(x.reply?L('客戶經理',esc(x.reply)):'')+'<button class="b" style="margin-top:12px" data-a="close">關閉</button>')}
  else if(a==='mkpay'){const amt=Number(v('pa'));if(!(amt>0))return alert('請輸入金額');const note=v('pn2'),ref=await db.collection('pay').add({amt,note,status:'open',ts:local()});S.pay={id:ref.id,amt,note,status:'open'};S.payUn&&S.payUn();S.payUn=db.doc('pay/'+ref.id).onSnapshot(s=>{if(s.exists&&S.pay){S.pay.status=s.data().status;render()}});render()}
  else if(a==='charge'){const amt=Number(v('pa'));if(!(amt>0))return alert('請輸入金額');if(bal()+loan()<amt)return alert('她的餘額不足');await db.collection('redeem').add({cid:'pay',n:v('pn2')||'付款',price:amt,status:'done',ts:local(),mk:mkey(),date:'',reply:'',kind:'pay'});alert('已扣款 '+fmt(amt))}
  else if(a==='payok'){const d=S.payInfo;if(!d)return;close();if(bal()+loan()<d.amt)return alert('餘額不足');await db.collection('redeem').add({cid:'pay',n:d.note||'付款',price:d.amt,status:'done',ts:local(),mk:mkey(),date:'',reply:'',kind:'pay'});await db.doc('pay/'+d.id).update({status:'paid'});S.payInfo=null;popSuccess({price:d.amt,n:d.note})}
  else if(a==='seed'){el.disabled=true;el.textContent='建立中…';await seed()}
  else if(a==='ask'){const c=S.c.find(x=>x.id===id);modal(`<div style="font-size:36px">${c.ic||'🎫'}</div><h1 style="font-size:18px;margin:8px 0">${esc(c.n)}</h1><p class="sm">確定要使用 ${fmt(c.price)} 兌換嗎？</p><input id="rd" placeholder="想使用的日期／時間（選填）"><div class="row" style="margin-top:10px"><button class="b g" style="flex:1" data-a="close">取消</button><button class="b" style="flex:1" data-a="go" data-id="${id}">確定兌換</button></div>`)}
  else if(a==='close')close();
  else if(a==='pin'){const c=S.c.find(x=>x.id===id);await db.doc('coupons/'+id).update({pin:!c.pin})}
  else if(a==='wipe'){if(!confirm('會刪除所有兌換、入帳、簽到、許願與付款紀錄，餘額歸零後重新入帳本月額度。券和設定不受影響。確定嗎？'))return;for(const k of ['redeem','ledger','pay','wish']){const q=await db.collection(k).get(),b=db.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit()}alert('已清除');location.reload()}
  else if(a==='go'){const c=S.c.find(x=>x.id===id),i=info(c);if(i.st!=='ok'){close();return}
    const date=v('rd');close();await db.collection('redeem').add({cid:id,n:c.n,price:c.price,status:'pending',ts:local(),mk:mkey(),date,reply:''});
    modal(`<div class="ck">✓</div><h1 style="font-size:18px">交易已受理</h1><div class="bal" style="margin:6px 0">-${Number(c.price).toLocaleString()}</div><p class="sm">${esc(c.n)} · 客戶經理處理中</p><a class="b" style="display:inline-block;text-decoration:none;margin:12px 6px 0" href="https://line.me/R/share?text=${encodeURIComponent('【'+S.p.name+'】兌換申請：'+c.n+'（'+fmt(c.price)+'），請客戶經理處理 ♥')}">通知客戶經理</a><button class="b g" style="margin-top:12px" data-a="close">關閉</button>`)}
  else if(a==='done'||a==='rej'){await db.doc('redeem/'+id).update({status:a==='done'?'done':'rejected',reply:v('re'+id)})}
  else if(a==='save'){const n=v('en').trim(),p=Number(v('ep'));if(!n||!(p>=0))return alert('請填名稱和價格');const e=S.edit||{};
    const d={n,price:p,cat:v('ec'),ic:v('ei')||'🎫',lt:v('et'),ln:Number(v('el'))||0,exp:v('ex'),on:e.on??true,hid:e.hid||false,pin:e.pin||false,o:e.o??Date.now()};
    await db.doc('coupons/'+(e.id||'c'+Date.now())).set(d);S.edit=null;render()}
  else if(a==='edit'){S.edit=S.c.find(x=>x.id===id);render();window.scrollTo(0,0)}
  else if(a==='cancel'){S.edit=null;render()}
  else if(a==='tog'){const c=S.c.find(x=>x.id===id);await db.doc('coupons/'+id).update({on:!c.on})}
  else if(a==='credit'){const n=Number(v('ca'));if(!n)return;await db.collection('ledger').add({amt:n,note:v('cn')||'入帳',ts:local()});$('#ca').value='';$('#cn').value=''}
  else if(a==='prof'){await db.doc('bank/profile').set({name:v('pn')||'寶貝',monthly:Number(v('pm'))||0,brand:v('pb')||'♥',msg:v('pg'),em:v('pe'),loan:Number(v('pl'))||0,daily:v('pd')===''?20:Number(v('pd')),bonuses:v('pbn').split('\n').map(l=>l.trim().match(/^(\d\d-\d\d)\s+(\d+)\s*(.*)$/)).filter(Boolean).map(m=>({md:m[1],amt:+m[2],note:m[3]||'紅利入帳'}))});alert('已儲存')}
  }catch(e){alert('操作失敗：'+(e.message||e.code||e))}
});
init();
</script></body></html>
